[project]
name = "xplane12-flightplanner"
version = "0.2.0"
description = "A simple recreation of onlineflightplanner.org"
readme = "README.md"
authors = [
    { name = "Jens-Alrik Adrian", email = "jensalrik.adrian@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "reportlab>=5.1.0",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
xplane12-flightplanner = "xplane12_flightplanner.main:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
test = [
    "pytest>=9.2.0",
]
dev = [
    "ruff>=0.17.4",
]

[tool.ruff.lint]
extend-select = [
    "F",        # Pyflakes rules
    "W",        # PyCodeStyle warnings
    "E",        # PyCodeStyle errors
    "I",        # Sort imports properly
    "UP",       # Warn if certain things can changed due to newer Python versions
    "C4",       # Catch incorrect use of comprehensions, dict, list, etc
    "FA",       # Enforce from __future__ import annotations
    "ISC",      # Good use of string concatenation
    "ICN",      # Use common import conventions
    "RET",      # Good return practices
    "SIM",      # Common simplification rules
    "TID",      # Some good import practices
    "TC",       # Enforce importing certain types in a TYPE_CHECKING block
    "PTH",      # Use pathlib instead of os.path
    "TD",       # Be diligent with TODO comments
    "NPY",      # Some numpy-specific things
    "FURB",     # Suggest more idiomatic Python patterns
]
